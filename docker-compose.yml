services:
  api:
    build: ./apps/api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mcp-server:
    build: ./apps/mcp-server
    ports:
      - "${MCP_PORT:-8001}:8001"
    env_file: .env
    environment:
      MCP_TRANSPORT: sse
    volumes:
      - ./data:/data:ro
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - api
