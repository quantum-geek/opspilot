services:
  api:
    build: ./apps/api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-server:
    build: ./apps/mcp-server
    ports:
      - "${MCP_PORT:-8001}:8001"
    env_file: .env
    volumes:
      - ./data:/data:ro
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - api
